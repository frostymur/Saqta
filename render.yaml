databases:
  - name: saqta-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: saqta
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: saqta-db
          property: connectionString
      - key: MQTT_ENABLED
        value: "true"
      - key: MQTT_HOST
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_TOPIC
        value: saqta/floodwatch/sko-demo/telemetry/#
      - key: MQTT_STATUS_TOPIC
        value: saqta/floodwatch/sko-demo/status/#
