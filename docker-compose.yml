version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: saqta_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/backend/saqta.db
      - SECRET_KEY=saqta-secret-key-digital-urpaq-2026-esil-kazakhstan
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - saqta_data:/app/backend
      - ./backend/ml:/app/backend/ml

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: saqta_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  saqta_data:
